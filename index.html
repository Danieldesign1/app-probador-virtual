<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Probador Virtual</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f7f9fc;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
            font-size: 1.1rem;
        }
        .cta-button {
            background-color: #0070f3;
            color: white;
            padding: 1rem 2rem;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s;
            display: inline-block;
            border: none;
            cursor: pointer;
        }
        .cta-button:hover {
            background-color: #0060cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Probador Virtual</h1>
        <p>Previsualiza cómo luce esta prenda en tu cuerpo antes de realizar tu compra.</p>
        <button class="cta-button" onclick="alert('Función de prueba en desarrollo.')">Pruébatelo Ahora</button>
    </div>
</body>
</html>
