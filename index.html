<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Probador Virtual</title>
    <!-- Script de Puter.js para generación de imágenes -->
    <script src="https://cdn.jsdelivr.net/npm/puter-js@latest/dist/puter.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f7f9fc;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
            font-size: 1.1rem;
        }
        .cta-button {
            background-color: #0070f3;
            color: white;
            padding: 1rem 2rem;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s;
            display: inline-block;
            border: none;
            cursor: pointer;
        }
        .cta-button:hover {
            background-color: #0060cc;
        }
        #result-container {
            margin-top: 2rem;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Probador Virtual</h1>
        <p>Previsualiza cómo luce esta prenda en tu cuerpo antes de realizar tu compra.</p>
        <button class="cta-button" id="try-button">Pruébatelo Ahora</button>
        <div id="result-container"></div>
    </div>

    <script>
        document.getElementById('try-button').addEventListener('click', async () => {
            const container = document.getElementById('result-container');
            container.innerHTML = '<p>Generando prueba virtual...</p>';

            try {
                // Función de Puter.js para generar imagen
                const imageElement = await puter.ai.txt2img("A realistic model wearing a modern streetwear hoodie, high quality, studio lighting");
                container.innerHTML = ''; // Limpiar mensaje de carga
                container.appendChild(imageElement);
            } catch (error) {
                console.error("Error al generar la imagen:", error);
                container.innerHTML = '<p>Hubo un error al generar la imagen. Inténtalo de nuevo.</p>';
            }
        });
    </script>
</body>
</html>
